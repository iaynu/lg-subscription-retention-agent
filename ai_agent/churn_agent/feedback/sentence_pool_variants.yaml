  - 청구가 예상과 다르니 서비스 이용이 망설여져요.
  - 가입할 때 들은 내용이 청구에 그대로 반영되지 않았어요.
  - 요금이 오르는 타이밍을 미리 몰라서 당황했어요.
  - 청구 항목이 늘어나는 것 같아 마음이 불편해요.
  - 비교해보니 제가 내는 부담이 더 크더라고요.
  - 기대했던 금액보다 청구가 커서 확인을 여러 번 했어요.
  - 할인 종료 후 금액 변화를 미리 알려주셨으면 했어요.
  - 쓰지 않는 항목까지 포함된 듯해서 답답했어요.
  exit:
