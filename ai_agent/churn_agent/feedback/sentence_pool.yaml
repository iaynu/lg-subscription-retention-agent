# 주관식(open) 문장 풀 — 사람이 쓴 시드 문장 (설계: survey_simulator_design.md §3.9). 가설 기반 synthetic data.
# 코드: 불편 코드 10개(cost~cs) + 숨은 주제 H-A·H-B + sat(불편 없음·만족) + other(기타).
# 변형 문장은 scripts/build_sentence_pool.py 가 LLM으로 만들어 feedback/sentence_pool_variants.yaml 로 저장하고, 팀이 검토해 확정한다.
# issue_other: issues에서 '기타'를 고른 응답자의 짧은 직접 입력 문구.
seeds:
  cost:
    - 가입할 때 안내받은 금액보다 청구 금액이 올라서 당황스러웠어요.
    - 할인 기간이 끝나니 요금이 확 늘었는데 미리 알려주지 않았어요.
    - 다른 곳이랑 비교하면 월 요금이 부담돼요.
    - 쓰지도 않는 케어 비용까지 내는 느낌이에요.
  exit:
    - 해지하려고 하니 위약금이 너무 커서 선뜻 못 하겠어요.
    - 이사 가는데 해지도 이전 설치도 절차가 복잡해요.
    - 해지 신청을 어디서 하는지 찾기 어려웠어요.
    - 중도 해지하면 얼마를 내야 하는지 설명이 불분명했어요.
  renew:
    - 만기가 다가오니 재계약 안내가 계속 와서 부담스러워요.
    - 새 모델이 나왔는데 갈아타는 조건이 마음에 안 들어요.
    - 지금 쓰는 모델이 단종이라는데 대안 설명이 부족해요.
    - 재계약하면 요금이 오르는 건지 정확히 모르겠어요.
  idle:
    - 집에 있는 시간이 적어서 거의 사용하지 않아요.
    - 한동안 안 쓰는데도 요금은 계속 나가요.
    - 계절에 따라 쓰는 날이 달라서 아깝게 느껴져요.
    - 처음엔 자주 썼는데 요즘은 손이 잘 안 가요.
  care:
    - 케어를 받은 뒤에 오히려 문제가 생겼어요.
    - 케어 시간이 너무 짧아서 제대로 한 건지 모르겠어요.
    - 케어 받고 며칠 안 돼서 다시 고장이 났어요.
    - 점검한다고 왔는데 눈에 띄는 변화가 없었어요.
  visit:
    - 방문 일정이 계속 미뤄져서 기다리기 힘들었어요.
    - 방문하기로 한 날 연락도 없이 오지 않았어요.
    - 평일 낮에는 집에 없어서 방문 시간 맞추기가 어려워요.
    - 예약을 바꾸려는데 조율이 잘 안 됐어요.
  manager:
    - 담당자가 자주 바뀌어서 매번 처음부터 설명해야 해요.
    - 방문하신 분 태도가 불친절해서 기분이 상했어요.
    - 집에 들어오는 분이 바뀌는데 미리 안내가 없어 불안했어요.
    - 담당자마다 설명이 달라서 믿음이 안 가요.
  sales:
    - 방문할 때마다 다른 상품 가입을 권해서 부담스러웠어요.
    - 거절했는데도 계속 같은 이야기를 하셨어요.
    - 점검받으러 온 건데 영업 얘기가 더 길었어요.
    - 추가 상품을 권유받는 게 싫어서 방문이 꺼려져요.
  fail:
    - 같은 증상으로 여러 번 수리를 받았는데 또 고장 났어요.
    - 작동할 때 소음이 심해졌어요.
    - 성능이 예전 같지 않아서 쓰기가 불편해요.
    - 자꾸 고장 나서 제품을 믿을 수가 없어요.
  cs:
    - 문의 전화가 잘 연결되지 않고 답변도 느려요.
    - 상담원마다 말이 달라서 처음부터 다시 설명했어요.
    - 문제가 해결됐는지 확인 연락이 끝까지 없었어요.
    - 수리 접수가 두 곳으로 나뉘어서 서로 책임을 미뤘어요.
  H-A:
    - 가입할 때 설명 들은 서비스 범위와 실제로 받는 서비스가 달라요.
    - 계약 내용이 상담 때 들은 것과 다르다고 느꼈어요.
    - 이 정도까지 해주는 줄 알았는데 막상 쓰니 포함이 아니라고 하더라고요.
    - 가입 때 구체적인 조건을 제대로 못 들은 것 같아요.
  H-B:
    - 케어를 받아도 제가 직접 관리하는 것과 차이를 모르겠어요.
    - 청소는 직접 해도 되는데 굳이 비용을 내야 하나 싶어요.
    - 케어 효과가 눈으로 확인이 안 돼서 가치를 모르겠어요.
    - 집에서 간단히 관리하면 되는 것 같아 케어가 꼭 필요한지 의문이에요.
  sat:
    - 특별히 불편한 점 없이 잘 쓰고 있어요.
    - 관리받는 게 편해서 만족하고 있어요.
    - 문제가 생겼을 때 빨리 처리해 줘서 좋았어요.
    - 지금은 크게 바라는 게 없어요.
  other:
    - 딱 하나로 말하기는 어렵지만 전반적으로 아쉬운 점이 있어요.
    - 기대했던 것과 조금 달라요.
    - 앱 사용이 불편한 부분이 있어요.
    - 안내가 너무 늦게 와서 아쉬웠어요.
  issue_other:
    - 앱 알림이 너무 많아요
    - 설치 위치 문제
    - 안내 문자가 잘못 왔어요
    - 결제일을 바꾸고 싶어요
    - 기타 불편
